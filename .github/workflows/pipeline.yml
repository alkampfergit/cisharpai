name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        run: |
          OUTPUT=$(dotnet-gitversion /output json /config GitVersion.yml)
          echo "$OUTPUT"
          echo "semVer=$(echo "$OUTPUT" | jq -r '.SemVer')" >> $GITHUB_OUTPUT
          echo "assemblySemVer=$(echo "$OUTPUT" | jq -r '.AssemblySemVer')" >> $GITHUB_OUTPUT
          echo "assemblySemFileVer=$(echo "$OUTPUT" | jq -r '.AssemblySemFileVer')" >> $GITHUB_OUTPUT
          echo "informationalVersion=$(echo "$OUTPUT" | jq -r '.InformationalVersion')" >> $GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Restore
        run: dotnet restore Cisharpai.sln

      - name: Build
        run: >
          dotnet build Cisharpai.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.gitversion.outputs.semVer }}
          -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Run unit tests
        run: >
          dotnet test src/Cisharpai.Tests/Cisharpai.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Run integration tests
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          OPENAI_TEST_API_KEY: ${{ secrets.OPENAI_TEST_API_KEY }}
          ANTHROPIC_TEST_API_KEY: ${{ secrets.ANTHROPIC_TEST_API_KEY }}
          AZURE_OPENAI_TEST_ENDPOINT: ${{ secrets.AZURE_OPENAI_TEST_ENDPOINT }}
          AZURE_OPENAI_TEST_API_KEY: ${{ secrets.AZURE_OPENAI_TEST_API_KEY }}
          AZURE_OPENAI_TEST_DEPLOYMENTS: ${{ secrets.AZURE_OPENAI_TEST_DEPLOYMENTS }}
          COHERE_TEST_API_KEY: ${{ secrets.COHERE_TEST_API_KEY }}
        run: >
          dotnet test src/Cisharpai.Integration.Tests/Cisharpai.Integration.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Pack
        run: >
          dotnet pack Cisharpai.sln
          --configuration Release
          --no-build
          -p:PackageVersion=${{ steps.gitversion.outputs.semVer }}
          --output ./nupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: snupkg
          path: ./nupkg/*.snupkg

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./nupkg

      - name: Download symbol packages
        uses: actions/download-artifact@v4
        with:
          name: snupkg
          path: ./nupkg

      - name: Push to NuGet
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbols to NuGet
        run: >
          dotnet nuget push "./nupkg/*.snupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

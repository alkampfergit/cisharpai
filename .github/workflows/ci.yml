name: Cisharpai CI

on:
  push:
    branches: [main, master, develop, 'feature/**', 'hotfix/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write
  checks: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Run build script
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Run integration tests
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          OPENAI_TEST_API_KEY: ${{ secrets.OPENAI_TEST_API_KEY }}
          ANTHROPIC_TEST_API_KEY: ${{ secrets.ANTHROPIC_TEST_API_KEY }}
          AZURE_OPENAI_TEST_ENDPOINT: ${{ secrets.AZURE_OPENAI_TEST_ENDPOINT }}
          AZURE_OPENAI_TEST_API_KEY: ${{ secrets.AZURE_OPENAI_TEST_API_KEY }}
          AZURE_OPENAI_TEST_DEPLOYMENTS: ${{ secrets.AZURE_OPENAI_TEST_DEPLOYMENTS }}
          AZURE_OPENAI_TEST_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_TEST_EMBEDDING_DEPLOYMENT }}
          AZURE_INFERENCE_TEST_ENDPOINT: ${{ secrets.AZURE_INFERENCE_TEST_ENDPOINT }}
          AZURE_INFERENCE_TEST_API_KEY: ${{ secrets.AZURE_INFERENCE_TEST_API_KEY }}
          AZURE_INFERENCE_TEST_MODELS: ${{ secrets.AZURE_INFERENCE_TEST_MODELS }}
          COHERE_TEST_API_KEY: ${{ secrets.COHERE_TEST_API_KEY }}
        run: |
          dotnet test src/Cisharpai.Integration.Tests/Cisharpai.Integration.Tests.csproj `
            --configuration Release `
            --logger "trx;LogFilePrefix=integration-tests" `
            --results-directory artifacts/TestResults/integration

      - name: Flatten all TRX files
        shell: bash
        if: always()
        run: |
          mkdir -p flattened-trx
          find artifacts/TestResults -name "*.trx" -type f -exec cp {} flattened-trx/ \;
          echo "Found $(find flattened-trx -name '*.trx' | wc -l) TRX files"

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637
        with:
          name: Test Run Summary
          path: 'flattened-trx/*.trx'
          reporter: dotnet-trx
          use-actions-summary: 'true'
          fail-on-error: 'false'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: flattened-trx/
          retention-days: 7

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/NuGet/*.nupkg

      - name: Upload symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-symbols
          path: artifacts/NuGet/*.snupkg

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkg

      - name: Download symbol packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-symbols
          path: ./nupkg

      - name: Push to NuGet
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbols to NuGet
        run: >
          dotnet nuget push "./nupkg/*.snupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

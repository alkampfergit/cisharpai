name: 'Test Report'

on:
  workflow_run:
    workflows: ['Cisharpai CI']
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: test-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log triggering workflow
        run: |
          echo "Triggered by workflow run:"
          echo "  Run ID: ${{ github.event.workflow_run.id }}"
          echo "  Run URL: ${{ github.event.workflow_run.html_url }}"
          echo "  Head SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "  Conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Download test results from triggering run
        uses: actions/download-artifact@v4
        with:
          name: TestResults
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish test report
        uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637
        with:
          name: Test Run Summary
          path: '*.trx'
          reporter: dotnet-trx
          use-actions-summary: 'true'

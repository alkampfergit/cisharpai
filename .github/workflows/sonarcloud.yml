name: SonarCloud

on:
  push:
    branches:
      - main
      - master
      - develop
      - hotfix/*
      - release/*
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sonar/scanner
          dotnet tool install dotnet-sonarscanner --tool-path .sonar/scanner

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          # Restore tools (GitVersion etc.)
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore failed" }

          # Run GitVersion
          $gv = dotnet tool run dotnet-gitversion /output json /config GitVersion.yml | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "GitVersion failed" }
          Write-Host "Version: $($gv.SemVer)"

          $assemblyVer = $gv.AssemblySemVer
          $assemblyFileVersion = $gv.AssemblySemFileVer
          $assemblyInformationalVersion = $gv.InformationalVersion

          # Begin SonarCloud analysis
          .sonar/scanner/dotnet-sonarscanner begin `
            /k:"alkampfergit_cisharpai" `
            /o:"alkampfergit-github" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.vstest.reportsPaths="artifacts/TestResults/**/*.trx" `
            /d:sonar.cs.opencover.reportsPaths="artifacts/TestResults/**/coverage.opencover.xml" `
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/Cisharp.Console/**"
          if ($LASTEXITCODE -ne 0) { throw "SonarScanner begin failed" }

          # Restore
          dotnet restore Cisharpai.sln
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }

          # Build
          dotnet build Cisharpai.sln `
            --configuration Release `
            --no-restore `
            /p:AssemblyVersion=$assemblyVer `
            /p:FileVersion=$assemblyFileVersion `
            /p:InformationalVersion=$assemblyInformationalVersion
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          # Test with coverage (unit tests only)
          $frameworks = @("net8.0", "net10.0")
          foreach ($tfm in $frameworks) {
            Write-Host "`nRunning tests for $tfm"
            $resultsDir = "artifacts/TestResults/$tfm"
            New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null

            dotnet test src/Cisharpai.Tests/Cisharpai.Tests.csproj `
              --configuration Release `
              --no-build `
              -f $tfm `
              --logger "trx;LogFilePrefix=Cisharpai.Tests-$tfm" `
              --results-directory $resultsDir `
              --collect:"XPlat Code Coverage" `
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
            if ($LASTEXITCODE -ne 0) { throw "Tests failed for $tfm" }
          }

          # End SonarCloud analysis
          .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw "SonarScanner end failed" }

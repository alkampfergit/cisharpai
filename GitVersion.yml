mode: ContinuousDeployment

branches:
  main:
    regex: ^master$|^main$
    increment: Patch
  develop:
    regex: ^dev(elop)?(ment)?$
    label: alpha
    increment: Minor
  feature:
    regex: ^features?[/-]
    label: alpha
    increment: Inherit
  release:
    regex: ^releases?[/-]
    label: beta
    increment: None
  hotfix:
    regex: ^hotfix(es)?[/-]
    label: beta
    increment: Patch

ignore:
  sha: []
